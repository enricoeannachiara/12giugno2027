<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test busta matrimonio</title>

<style>
:root{
  --bg:#FAF7F2;
  --text:#3E3A39;
  --paper-front:#EADCC8;
  --paper-back:#E4D3BC;
  --paper-side:#E8D7C0;
  --paper-bottom:#EBDCC6;
  --paper-edge:#C8B18F;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Georgia,serif;
}

.hero{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px 20px;
  text-align:center;
}

.hero img{
  display:block;
  width:min(72vw,340px);
  height:auto;
  margin-bottom:20px;
}

.hero h1{
  margin:0;
  font-size:clamp(2.2rem,8vw,4rem);
  font-weight:400;
}

.hero p{
  margin:18px 0 0;
  font-size:1rem;
  letter-spacing:4px;
}

.envelope-test{
  position:fixed;
  inset:0;
  z-index:100;
  perspective:1800px;
  perspective-origin:50% 10%;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.envelope-body{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
  transform:translateY(0);
  will-change:transform;
}

.body-svg,
.flap-svg{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}

.flap-shadow{
  position:absolute;
  left:50%;
  top:50%;
  z-index:12;
  width:65%;
  height:13%;
  transform:translate(-50%,-50%) scaleY(.04);
  transform-origin:center;
  background:radial-gradient(
    ellipse at center,
    rgba(70,48,30,.22) 0%,
    rgba(70,48,30,.09) 48%,
    rgba(70,48,30,0) 80%
  );
  filter:blur(12px);
  opacity:0;
  pointer-events:none;
  will-change:opacity,transform;
}

.flap{
  position:absolute;
  left:0;
  top:0;
  z-index:20;
  width:100vw;
  height:50vh;
  transform-origin:50% 0;
  transform-style:preserve-3d;
  opacity:1;
  will-change:transform,opacity;
}

.wax-seal{
  position:absolute;
  left:50%;
  top:100%;
  z-index:30;
  width:108px;
  height:108px;
  transform:translate(-50%,-50%) translateZ(5px);
  transform-origin:center;
  pointer-events:none;
  will-change:left,top;
}

.wax-seal img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 6px 7px rgba(70,25,20,.24));
}

.hint{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:200;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:999px;
  background:rgba(250,247,242,.87);
  color:#77706A;
  font-family:Arial,sans-serif;
  font-size:.78rem;
  letter-spacing:1px;
  pointer-events:none;
  transition:opacity .3s ease;
}

.hint.hidden{opacity:0}

.restart{
  position:fixed;
  top:18px;
  right:18px;
  z-index:300;
  min-width:44px;
  min-height:44px;
  padding:10px 15px;
  border:0;
  border-radius:999px;
  background:rgba(255,255,255,.93);
  color:#4C4743;
  font-size:.85rem;
  cursor:pointer;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

@media(max-width:600px){
  .wax-seal{
    width:96px;
    height:96px;
  }
}
</style>
</head>

<body>

<main class="hero">
  <img src="images/ritratto.png" alt="Enrico e Annachiara">
  <h1>Enrico &amp; Annachiara</h1>
  <p>12 giugno 2027</p>
</main>

<div
  class="envelope-test"
  id="envelopeTest"
  role="button"
  tabindex="0"
  aria-label="Apri la busta"
>

  <div class="flap-shadow" id="flapShadow"></div>

  <div class="envelope-body" id="envelopeBody">
    <svg
      class="body-svg"
      viewBox="0 0 1000 1000"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        id="bodyLeftPath"
        fill="#E8D7C0"
      ></path>

      <path
        id="bodyLeftFold"
        fill="none"
        stroke="rgba(105,82,58,.22)"
        stroke-width="2"
        vector-effect="non-scaling-stroke"
      ></path>

      <path
        id="bodyRightPath"
        fill="#E8D7C0"
      ></path>

      <path
        id="bodyRightFold"
        fill="none"
        stroke="rgba(105,82,58,.22)"
        stroke-width="2"
        vector-effect="non-scaling-stroke"
      ></path>

      <path
        id="bodyBottomPath"
        fill="#EBDCC6"
      ></path>

      <path
        id="bodyBottomFold"
        fill="none"
        stroke="rgba(105,82,58,.24)"
        stroke-width="2"
        vector-effect="non-scaling-stroke"
      ></path>
    </svg>
  </div>

  <div class="flap" id="flap">

    <svg
      class="flap-svg"
      viewBox="0 0 1000 1000"
      preserveAspectRatio="none"
      aria-hidden="true"
    >

      <defs>

        <linearGradient
          id="paperFront"
          x1="0"
          y1="0"
          x2="0"
          y2="1"
        >
          <stop
            id="frontStop1"
            offset="0%"
            stop-color="#EADCC8"
          ></stop>

          <stop
            id="frontStop2"
            offset="65%"
            stop-color="#EADCC8"
          ></stop>

          <stop
            id="frontStop3"
            offset="100%"
            stop-color="#DEC8AD"
          ></stop>
        </linearGradient>

        <linearGradient
          id="paperBack"
          x1="0"
          y1="0"
          x2="0"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#E6D6C0"
          ></stop>

          <stop
            offset="100%"
            stop-color="#DCC5A8"
          ></stop>
        </linearGradient>

        <filter
          id="paperShadow"
          x="-20%"
          y="-20%"
          width="140%"
          height="160%"
        >
          <feDropShadow
            dx="0"
            dy="4"
            stdDeviation="5"
            flood-color="#654B35"
            flood-opacity=".08"
          ></feDropShadow>
        </filter>

      </defs>

      <path
        id="flapEdgePath"
        fill="none"
        stroke="#C8B18F"
        stroke-width="3"
        vector-effect="non-scaling-stroke"
        opacity=".55"
      ></path>

      <path
        id="flapPath"
        fill="url(#paperFront)"
        filter="url(#paperShadow)"
      ></path>

    </svg>

    <div
      class="wax-seal"
      id="waxSeal"
    >
      <img
        src="images/sigillo-AE.png"
        alt=""
        draggable="false"
      >
    </div>

  </div>

</div>

<div class="hint" id="hint">
  Tocca per aprire
</div>

<button
  type="button"
  class="restart"
  id="restartButton"
>
  Riavvia
</button>

<script>
const $ = id => document.getElementById(id);

const envelopeTest = $("envelopeTest");
const envelopeBody = $("envelopeBody");

const flap = $("flap");
const flapPath = $("flapPath");
const flapEdgePath = $("flapEdgePath");
const flapShadow = $("flapShadow");

const waxSeal = $("waxSeal");

const frontStop1 = $("frontStop1");
const frontStop2 = $("frontStop2");
const frontStop3 = $("frontStop3");

const bodyLeftPath = $("bodyLeftPath");
const bodyRightPath = $("bodyRightPath");
const bodyBottomPath = $("bodyBottomPath");

const bodyLeftFold = $("bodyLeftFold");
const bodyRightFold = $("bodyRightFold");
const bodyBottomFold = $("bodyBottomFold");

const hint = $("hint");
const restartButton = $("restartButton");

const FLAP_DURATION = 3400;
const BODY_START = 1600;
const BODY_DURATION = 1450;
const FLAP_FADE_DURATION = 280;

let flapFrameId = null;
let bodyFrameId = null;
let fadeFrameId = null;

let opening = false;
let opened = false;

function clamp(value,min,max){
  return Math.min(Math.max(value,min),max);
}

function easeInOutCubic(t){
  return t < .5
    ? 4*t*t*t
    : 1 - Math.pow(-2*t+2,3)/2;
}

function easeOutCubic(t){
  return 1 - Math.pow(1-t,3);
}

function bendCurve(t){
  return Math.pow(
    Math.max(0,Math.sin(Math.PI*t)),
    .72
  );
}

function wait(ms){
  return new Promise(resolve=>{
    setTimeout(resolve,ms);
  });
}

function getFlapGeometry(t){

  const bend = bendCurve(t);

  const tipX = 500;
  const tipY = 1000 - 190*bend;

  const shoulderY = 420 + 35*bend;

  const leftShoulderX = 12*bend;
  const rightShoulderX = 1000 - 12*bend;

  const rightControl1X = 835 - 18*bend;
  const rightControl1Y = 590 + 15*bend;

  const rightControl2X = 625 - 10*bend;
  const rightControl2Y = 860 - 50*bend;

  const leftControl1X = 165 + 18*bend;
  const leftControl1Y = rightControl1Y;

  const leftControl2X = 375 + 10*bend;
  const leftControl2Y = rightControl2Y;

  const d = `
    M 0 0

    L 1000 0

    L 1000 ${shoulderY-30}

    Q
      1000 ${shoulderY}
      ${rightShoulderX} ${shoulderY}

    C
      ${rightControl1X} ${rightControl1Y},
      ${rightControl2X} ${rightControl2Y},
      ${tipX} ${tipY}

    C
      ${leftControl2X} ${leftControl2Y},
      ${leftControl1X} ${leftControl1Y},
      ${leftShoulderX} ${shoulderY}

    Q
      0 ${shoulderY}
      0 ${shoulderY-30}

    L 0 0

    Z
  `;

  return{
    d,
    tipY,
    bend
  };
}

function drawEnvelopeBody(){

  const sideStartY = 192.5;
  const sideMeetY = 500;

  const leftMeetX = 492;
  const rightMeetX = 508;

  bodyLeftPath.setAttribute(
    "d",
    `
      M 0 ${sideStartY}
      L ${leftMeetX} ${sideMeetY}
      L 0 1000
      Z
    `
  );

  bodyLeftFold.setAttribute(
    "d",
    `
      M 0 ${sideStartY}
      L ${leftMeetX} ${sideMeetY}
    `
  );

  bodyRightPath.setAttribute(
    "d",
    `
      M 1000 ${sideStartY}
      L 1000 1000
      L ${rightMeetX} ${sideMeetY}
      Z
    `
  );

  bodyRightFold.setAttribute(
    "d",
    `
      M 1000 ${sideStartY}
      L ${rightMeetX} ${sideMeetY}
    `
  );

  const tipY = 490;

  const tipLeftX = 468;
  const tipRightX = 532;

  const tipSideY = 505;

  const verticalStartY = 750;

  bodyBottomPath.setAttribute(
    "d",
    `
      M 0 1000

      L 0 ${verticalStartY}

      L ${tipLeftX} ${tipSideY}

      Q
        500 ${tipY}
        ${tipRightX} ${tipSideY}

      L 1000 ${verticalStartY}

      L 1000 1000

      Z
    `
  );

  bodyBottomFold.setAttribute(
    "d",
    `
      M 0 ${verticalStartY}

      L ${tipLeftX} ${tipSideY}

      Q
        500 ${tipY}
        ${tipRightX} ${tipSideY}

      L 1000 ${verticalStartY}
    `
  );
}

function drawFlapFrame(progress){

  const t = clamp(progress,0,1);

  const geometry = getFlapGeometry(t);

  const bend = geometry.bend;

  let rotation;

  if(t < .94){

    rotation =
      181.5 *
      easeInOutCubic(
        t/.94
      );

  }else{

    const settle =
      (t-.94)/.06;

    rotation =
      181.5 -
      1.5 *
      easeOutCubic(settle);
  }

  const depth =
    20*bend;

  flap.style.transform =
    `rotateX(${rotation}deg)
     translateZ(${depth}px)`;

  flapPath.setAttribute(
    "d",
    geometry.d
  );

  flapEdgePath.setAttribute(
    "d",
    geometry.d
  );

  flapPath.setAttribute(
    "fill",
    rotation < 90
      ? "url(#paperFront)"
      : "url(#paperBack)"
  );

  waxSeal.style.left =
    "50%";

  waxSeal.style.top =
    `${geometry.tipY/10}%`;

  waxSeal.style.visibility =
    rotation < 90
      ? "visible"
      : "hidden";

  flapShadow.style.opacity =
    `${.23*bend}`;

  flapShadow.style.transform =
    `
      translate(
        -50%,
        ${-50 + 17*t}%
      )

      scaleX(
        ${.93 - .15*bend}
      )

      scaleY(
        ${.08 + .74*bend}
      )
    `;

  const shade =
    Math.round(
      8*bend
    );

  frontStop1.setAttribute(
    "stop-color",
    `rgb(
      ${234-shade},
      ${220-shade},
      ${200-shade}
    )`
  );

  frontStop2.setAttribute(
    "stop-color",
    `rgb(
      ${234-shade/2},
      ${220-shade/2},
      ${200-shade/2}
    )`
  );

  frontStop3.setAttribute(
    "stop-color",
    `rgb(
      ${222-shade},
      ${200-shade},
      ${173-shade}
    )`
  );
}

function animate(duration,draw,setFrame){

  return new Promise(resolve=>{

    const start =
      performance.now();

    function frame(now){

      const progress =
        clamp(
          (now-start)/duration,
          0,
          1
        );

      draw(progress);

      if(progress < 1){

        setFrame(
          requestAnimationFrame(frame)
        );

      }else{

        setFrame(null);

        resolve();
      }
    }

    setFrame(
      requestAnimationFrame(frame)
    );
  });
}

function animateFlap(){

  return animate(
    FLAP_DURATION,
    drawFlapFrame,
    id=>{
      flapFrameId=id;
    }
  );
}

function animateEnvelopeDown(){

  return animate(
    BODY_DURATION,

    progress=>{

      const e =
        easeInOutCubic(progress);

      envelopeBody.style.transform =
        `translateY(${112*e}vh)`;
    },

    id=>{
      bodyFrameId=id;
    }
  );
}

function fadeOutFlap(){

  return animate(
    FLAP_FADE_DURATION,

    progress=>{

      const e =
        easeOutCubic(progress);

      flap.style.opacity =
        `${1-e}`;

      flapShadow.style.opacity =
        `${.06*(1-e)}`;
    },

    id=>{
      fadeFrameId=id;
    }

  ).then(()=>{

    flap.style.opacity="0";

    flapShadow.style.opacity="0";
  });
}

async function openEnvelope(){

  if(
    opening ||
    opened
  ){
    return;
  }

  opening=true;

  hint.classList.add(
    "hidden"
  );

  const flapPromise =
    animateFlap();

  await wait(
    BODY_START
  );

  const bodyPromise =
    animateEnvelopeDown();

  await flapPromise;

  const fadePromise =
    fadeOutFlap();

  await Promise.all([
    bodyPromise,
    fadePromise
  ]);

  opening=false;
  opened=true;
}

function cancelFrame(id){

  if(id){
    cancelAnimationFrame(id);
  }
}

function resetEnvelope(event){

  event.stopPropagation();

  cancelFrame(flapFrameId);
  cancelFrame(bodyFrameId);
  cancelFrame(fadeFrameId);

  flapFrameId=null;
  bodyFrameId=null;
  fadeFrameId=null;

  opening=false;
  opened=false;

  envelopeBody.style.transform =
    "translateY(0)";

  flap.style.transform =
    "rotateX(0deg) translateZ(0px)";

  flap.style.opacity =
    "1";

  waxSeal.style.visibility =
    "visible";

  flapShadow.style.opacity =
    "0";

  flapShadow.style.transform =
    "translate(-50%,-50%) scaleY(.04)";

  const initial =
    getFlapGeometry(0);

  flapPath.setAttribute(
    "d",
    initial.d
  );

  flapEdgePath.setAttribute(
    "d",
    initial.d
  );

  flapPath.setAttribute(
    "fill",
    "url(#paperFront)"
  );

  waxSeal.style.left =
    "50%";

  waxSeal.style.top =
    "100%";

  frontStop1.setAttribute(
    "stop-color",
    "#EADCC8"
  );

  frontStop2.setAttribute(
    "stop-color",
    "#EADCC8"
  );

  frontStop3.setAttribute(
    "stop-color",
    "#DEC8AD"
  );

  hint.classList.remove(
    "hidden"
  );
}

envelopeTest.addEventListener(
  "click",
  openEnvelope
);

envelopeTest.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" ||
      event.key===" "
    ){

      event.preventDefault();

      openEnvelope();
    }
  }
);

restartButton.addEventListener(
  "click",
  resetEnvelope
);

drawEnvelopeBody();

const initialGeometry =
  getFlapGeometry(0);

flapPath.setAttribute(
  "d",
  initialGeometry.d
);

flapEdgePath.setAttribute(
  "d",
  initialGeometry.d
);

waxSeal.style.left =
  "50%";

waxSeal.style.top =
  "100%";
</script>

</body>
</html>
