<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test busta SVG</title>

    <style>

        :root {
            --background: #FAF7F2;
            --text: #3E3A39;

            --paper-front: #EADCC8;
            --paper-back: #E4D2BA;
            --paper-edge: #C7B08F;

            --pocket-paper: #EADCC8;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;

            width: 100%;
            min-height: 100%;
        }


        body {
            background: var(--background);

            color: var(--text);

            font-family: Georgia, serif;

            overflow: hidden;
        }


        /* ================================================== */
        /* HERO                                               */
        /* ================================================== */

        .hero {
            position: fixed;

            inset: 0;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;
        }


        .hero img {
            width: min(72vw, 340px);

            height: auto;

            display: block;

            margin-bottom: 20px;
        }


        .hero h1 {
            margin: 0;

            font-size: clamp(2.2rem, 8vw, 4rem);

            font-weight: 400;
        }


        .hero p {
            margin: 18px 0 0;

            letter-spacing: 4px;

            font-size: 1rem;
        }


        /* ================================================== */
        /* SCENA                                              */
        /* ================================================== */

        .envelope-test {
            position: fixed;

            inset: 0;

            z-index: 100;

            perspective: 1700px;

            perspective-origin: 50% 15%;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        /* ================================================== */
        /* CORPO DELLA BUSTA                                  */
        /* ================================================== */

        .envelope-body {
            position: absolute;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            transform: translateY(0);

            will-change: transform;
        }


        .envelope-pocket {
            position: absolute;

            inset: 0;

            background: transparent;
        }


        .pocket-left,
        .pocket-right,
        .pocket-bottom {
            position: absolute;

            inset: 0;

            background: var(--pocket-paper);
        }


        .pocket-left {
            clip-path: polygon(
                0 0,
                50% 50%,
                0 100%
            );
        }


        .pocket-right {
            clip-path: polygon(
                100% 0,
                100% 100%,
                50% 50%
            );
        }


        .pocket-bottom {
            clip-path: polygon(
                0 100%,
                50% 50%,
                100% 100%
            );
        }


        /* ================================================== */
        /* OMBRA DEL LEMBO                                    */
        /* ================================================== */

        .flap-shadow {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 68%;
            height: 16%;

            z-index: 12;

            transform:
                translate(-50%, -50%)
                scaleY(0.05);

            transform-origin: center;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(66, 45, 28, 0.22) 0%,
                    rgba(66, 45, 28, 0.10) 46%,
                    rgba(66, 45, 28, 0) 78%
                );

            filter: blur(13px);

            opacity: 0;

            pointer-events: none;

            will-change:
                opacity,
                transform;
        }


        /* ================================================== */
        /* LEMBO                                              */
        /* ================================================== */

        .flap {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 50vh;

            z-index: 20;

            transform-origin: 50% 0;

            transform-style: preserve-3d;

            opacity: 1;

            will-change:
                transform,
                opacity;
        }


        /* ================================================== */
        /* SVG                                                */
        /* ================================================== */

        .flap-svg {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: visible;

            display: block;

            pointer-events: none;
        }


        /* ================================================== */
        /* SIGILLO                                            */
        /* ================================================== */

        .wax-seal {
            position: absolute;

            left: 50%;
            top: 100%;

            width: 108px;
            height: 108px;

            z-index: 30;

            transform:
                translate(-50%, -50%)
                translateZ(5px);

            transform-origin: center center;

            pointer-events: none;

            will-change:
                left,
                top;
        }


        .wax-seal img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 7px 7px
                    rgba(70, 25, 20, 0.25)
                );
        }


        /* ================================================== */
        /* INTERFACCIA TEST                                   */
        /* ================================================== */

        .hint {
            position: fixed;

            left: 50%;
            bottom: 24px;

            z-index: 200;

            transform: translateX(-50%);

            padding: 9px 15px;

            border-radius: 999px;

            background:
                rgba(250, 247, 242, 0.86);

            font-family: Arial, sans-serif;

            font-size: 0.78rem;

            letter-spacing: 1px;

            color: #77706A;

            pointer-events: none;

            transition:
                opacity 0.3s ease;
        }


        .hint.hidden {
            opacity: 0;
        }


        .restart {
            position: fixed;

            top: 18px;
            right: 18px;

            z-index: 300;

            min-width: 44px;
            min-height: 44px;

            padding: 10px 15px;

            border: 0;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.92);

            color: #4C4743;

            font-size: 0.85rem;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }


        @media (max-width: 600px) {

            .wax-seal {
                width: 96px;
                height: 96px;
            }

        }

    </style>
</head>


<body>


    <!-- ================================================== -->
    <!-- HERO                                               -->
    <!-- ================================================== -->

    <main class="hero">

        <img
            src="images/ritratto.png"
            alt="Enrico e Annachiara"
        >

        <h1>
            Enrico & Annachiara
        </h1>

        <p>
            12 giugno 2027
        </p>

    </main>


    <!-- ================================================== -->
    <!-- BUSTA                                              -->
    <!-- ================================================== -->

    <div
        class="envelope-test"
        id="envelopeTest"
        role="button"
        tabindex="0"
        aria-label="Apri la busta"
    >


        <!-- OMBRA -->

        <div
            class="flap-shadow"
            id="flapShadow"
        ></div>


        <!-- CORPO BUSTA -->

        <div
            class="envelope-body"
            id="envelopeBody"
        >

            <div class="envelope-pocket">

                <div class="pocket-left"></div>

                <div class="pocket-right"></div>

                <div class="pocket-bottom"></div>

            </div>

        </div>


        <!-- LEMBO -->

        <div
            class="flap"
            id="flap"
        >

            <svg
                class="flap-svg"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
                aria-hidden="true"
            >

                <defs>


                    <!-- FRONTE -->

                    <linearGradient
                        id="paperFront"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            id="frontStop1"
                            offset="0%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop2"
                            offset="55%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop3"
                            offset="100%"
                            stop-color="#DFCAB0"
                        />

                    </linearGradient>


                    <!-- RETRO -->

                    <linearGradient
                        id="paperBack"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            offset="0%"
                            stop-color="#E6D6C1"
                        />

                        <stop
                            offset="100%"
                            stop-color="#DCC6AA"
                        />

                    </linearGradient>


                    <!-- OMBRA -->

                    <filter
                        id="paperShadow"
                        x="-20%"
                        y="-20%"
                        width="140%"
                        height="160%"
                    >

                        <feDropShadow
                            dx="0"
                            dy="5"
                            stdDeviation="6"
                            flood-color="#654B35"
                            flood-opacity="0.09"
                        />

                    </filter>

                </defs>


                <!-- BORDO -->

                <path
                    id="flapEdgePath"
                    d=""
                    fill="none"
                    stroke="#C7B08F"
                    stroke-width="3"
                    vector-effect="non-scaling-stroke"
                    opacity="0.55"
                />


                <!-- CARTA -->

                <path
                    id="flapPath"
                    d=""
                    fill="url(#paperFront)"
                    filter="url(#paperShadow)"
                />

            </svg>


            <!-- SIGILLO -->

            <div
                class="wax-seal"
                id="waxSeal"
            >

                <img
                    src="images/sigillo-AE.png"
                    alt=""
                    draggable="false"
                >

            </div>

        </div>

    </div>


    <div
        class="hint"
        id="hint"
    >
        Tocca per aprire
    </div>


    <button
        type="button"
        class="restart"
        id="restartButton"
    >
        Riavvia
    </button>



    <script>

        /* ================================================== */
        /* ELEMENTI                                          */
        /* ================================================== */

        const envelopeTest =
            document.getElementById("envelopeTest");

        const envelopeBody =
            document.getElementById("envelopeBody");

        const flap =
            document.getElementById("flap");

        const flapPath =
            document.getElementById("flapPath");

        const flapEdgePath =
            document.getElementById("flapEdgePath");

        const waxSeal =
            document.getElementById("waxSeal");

        const flapShadow =
            document.getElementById("flapShadow");

        const frontStop1 =
            document.getElementById("frontStop1");

        const frontStop2 =
            document.getElementById("frontStop2");

        const frontStop3 =
            document.getElementById("frontStop3");

        const hint =
            document.getElementById("hint");

        const restartButton =
            document.getElementById("restartButton");


        /* ================================================== */
        /* STATO                                             */
        /* ================================================== */

        let flapFrameId = null;
        let bodyFrameId = null;
        let fadeFrameId = null;

        let opening = false;
        let opened = false;


        /* ================================================== */
        /* TEMPI                                             */
        /* ================================================== */

        /*
            Apertura completa del lembo.
        */

        const flapDuration =
            3400;


        /*
            GRANDE ANTICIPO DELLA BUSTA.

            La discesa parte già dopo 1,8 s.

            Quindi per circa 1,6 secondi
            apertura del lembo e sfilamento
            avvengono contemporaneamente.
        */

        const bodyStart =
            1800;


        /*
            Durata discesa.
        */

        const bodyDuration =
            1450;


        /*
            Dissolvenza del lembo.
        */

        const flapFadeDuration =
            300;


        /* ================================================== */
        /* UTILITY                                           */
        /* ================================================== */

        function clamp(value, min, max) {

            return Math.min(
                Math.max(value, min),
                max
            );

        }


        function easeInOutCubic(t) {

            return (
                t < 0.5
                    ? 4 * t * t * t
                    : 1 -
                      Math.pow(
                          -2 * t + 2,
                          3
                      ) / 2
            );

        }


        function easeOutCubic(t) {

            return (
                1 -
                Math.pow(
                    1 - t,
                    3
                )
            );

        }


        function bendCurve(t) {

            const value =
                Math.sin(
                    Math.PI * t
                );

            return Math.pow(
                Math.max(0, value),
                0.72
            );

        }


        function wait(milliseconds) {

            return new Promise(
                (resolve) => {

                    setTimeout(
                        resolve,
                        milliseconds
                    );

                }
            );

        }


        /* ================================================== */
        /* GEOMETRIA DEL LEMBO                               */
        /* ================================================== */

        function getFlapGeometry(t) {

            const bend =
                bendCurve(t);


            /*
                Il lembo torna a occupare
                TUTTA la metà superiore.

                Quindi:

                sinistra = 0
                destra   = 1000
                punta    = 1000

                La punta corrisponde esattamente
                al centro verticale dello schermo.
            */

            const baseLeft =
                0;


            const baseRight =
                1000;


            const restingTipY =
                1000;


            /*
                Durante la piega la punta
                sale temporaneamente.

                A riposo però torna sempre
                al centro dello schermo.
            */

            const tipY =
                restingTipY -
                (235 * bend);


            const tipX =
                500 +
                (
                    5 *
                    Math.sin(
                        Math.PI *
                        t *
                        2
                    ) *
                    bend
                );


            /*
                QUI otteniamo l'angolo
                meno acuto.

                Non accorciamo il lembo.

                Facciamo invece arrivare
                le curve verso la punta
                molto più orizzontalmente.
            */


            const rightUpperX =
                930 -
                (25 * bend);


            const rightUpperY =
                260 +
                (100 * bend);


            /*
                Questo punto è volutamente
                molto lontano dalla punta.

                È ciò che rende l'angolo finale
                molto più aperto.
            */

            const rightLowerX =
                860 -
                (40 * bend);


            const rightLowerY =
                900 -
                (125 * bend);


            const leftUpperX =
                70 +
                (25 * bend);


            const leftUpperY =
                rightUpperY;


            const leftLowerX =
                140 +
                (40 * bend);


            const leftLowerY =
                rightLowerY;


            const d = `
                M ${baseLeft} 0

                L ${baseRight} 0

                C
                ${rightUpperX} ${rightUpperY},
                ${rightLowerX} ${rightLowerY},
                ${tipX} ${tipY}

                C
                ${leftLowerX} ${leftLowerY},
                ${leftUpperX} ${leftUpperY},
                ${baseLeft} 0

                Z
            `;


            return {
                d,
                tipX,
                tipY,
                bend
            };

        }


        /* ================================================== */
        /* DISEGNO FRAME LEMBO                               */
        /* ================================================== */

        function drawFlapFrame(progress) {

            const t =
                clamp(
                    progress,
                    0,
                    1
                );


            const geometry =
                getFlapGeometry(t);


            const bend =
                geometry.bend;


            /*
                Assestamento finale.
            */

            let rotation;


            if (t < 0.94) {

                rotation =
                    181.5 *
                    easeInOutCubic(
                        t / 0.94
                    );

            } else {

                const settle =
                    (t - 0.94) /
                    0.06;


                rotation =
                    181.5 -
                    (
                        1.5 *
                        easeOutCubic(
                            settle
                        )
                    );

            }


            const depth =
                20 * bend;


            flap.style.transform =
                `rotateX(${rotation}deg)
                 translateZ(${depth}px)`;


            /* ---------------------------------------------- */
            /* CARTA                                         */
            /* ---------------------------------------------- */

            flapPath.setAttribute(
                "d",
                geometry.d
            );


            flapEdgePath.setAttribute(
                "d",
                geometry.d
            );


            /* ---------------------------------------------- */
            /* FRONTE / RETRO                                */
            /* ---------------------------------------------- */

            if (rotation < 90) {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperFront)"
                );

            } else {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperBack)"
                );

            }


            /* ---------------------------------------------- */
            /* SIGILLO                                       */
            /* ---------------------------------------------- */

            waxSeal.style.left =
                `${geometry.tipX / 10}%`;


            waxSeal.style.top =
                `${geometry.tipY / 10}%`;


            waxSeal.style.visibility =
                rotation < 90
                    ? "visible"
                    : "hidden";


            /* ---------------------------------------------- */
            /* OMBRA                                         */
            /* ---------------------------------------------- */

            flapShadow.style.opacity =
                `${0.25 * bend}`;


            flapShadow.style.transform =
                `
                translate(
                    -50%,
                    ${-50 + 18 * t}%
                )

                scaleX(
                    ${0.90 - 0.16 * bend}
                )

                scaleY(
                    ${0.10 + 0.80 * bend}
                )
                `;


            /* ---------------------------------------------- */
            /* LUCE                                          */
            /* ---------------------------------------------- */

            const shade =
                Math.round(
                    9 * bend
                );


            frontStop1.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade},
                    ${220 - shade},
                    ${200 - shade}
                )`
            );


            frontStop2.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade / 2},
                    ${220 - shade / 2},
                    ${200 - shade / 2}
                )`
            );


            frontStop3.setAttribute(
                "stop-color",
                `rgb(
                    ${223 - shade},
                    ${202 - shade},
                    ${176 - shade}
                )`
            );

        }


        /* ================================================== */
        /* ANIMAZIONE LEMBO                                  */
        /* ================================================== */

        function animateFlap() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                flapDuration,
                                0,
                                1
                            );


                        drawFlapFrame(
                            progress
                        );


                        if (progress < 1) {

                            flapFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            flapFrameId =
                                null;

                            resolve();

                        }

                    }


                    flapFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* DISCESA DEL CORPO BUSTA                           */
        /* ================================================== */

        function animateEnvelopeDown() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                bodyDuration,
                                0,
                                1
                            );


                        const e =
                            easeInOutCubic(
                                progress
                            );


                        /*
                            Scende SOLO il corpo.

                            Il lembo rimane in alto
                            e verrà dissolto separatamente.
                        */

                        envelopeBody.style.transform =
                            `translateY(
                                ${112 * e}vh
                            )`;


                        if (progress < 1) {

                            bodyFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            bodyFrameId =
                                null;

                            resolve();

                        }

                    }


                    bodyFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* DISSOLVENZA LEMBO                                 */
        /* ================================================== */

        function fadeOutFlap() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                flapFadeDuration,
                                0,
                                1
                            );


                        const e =
                            easeOutCubic(
                                progress
                            );


                        flap.style.opacity =
                            `${1 - e}`;


                        flapShadow.style.opacity =
                            `${0.07 * (1 - e)}`;


                        if (progress < 1) {

                            fadeFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            flap.style.opacity =
                                "0";


                            flapShadow.style.opacity =
                                "0";


                            fadeFrameId =
                                null;


                            resolve();

                        }

                    }


                    fadeFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* APERTURA COMPLETA                                 */
        /* ================================================== */

        async function openEnvelope() {

            if (opening || opened) {
                return;
            }


            opening = true;


            hint.classList.add(
                "hidden"
            );


            /*
                Il lembo parte immediatamente.
            */

            const flapPromise =
                animateFlap();


            /*
                Dopo appena 1,8 secondi
                comincia già a sfilarsi
                la parte inferiore della busta.
            */

            await wait(
                bodyStart
            );


            const bodyPromise =
                animateEnvelopeDown();


            /*
                Lasciamo che il lembo
                completi il proprio gesto.
            */

            await flapPromise;


            /*
                Appena raggiunge la posizione
                completamente aperta,
                sparisce rapidamente.
            */

            const fadePromise =
                fadeOutFlap();


            await Promise.all([
                bodyPromise,
                fadePromise
            ]);


            opening = false;
            opened = true;

        }


        /* ================================================== */
        /* RESET                                             */
        /* ================================================== */

        function resetEnvelope(event) {

            event.stopPropagation();


            if (flapFrameId) {

                cancelAnimationFrame(
                    flapFrameId
                );

                flapFrameId = null;

            }


            if (bodyFrameId) {

                cancelAnimationFrame(
                    bodyFrameId
                );

                bodyFrameId = null;

            }


            if (fadeFrameId) {

                cancelAnimationFrame(
                    fadeFrameId
                );

                fadeFrameId = null;

            }


            opening = false;
            opened = false;


            envelopeBody.style.transform =
                "translateY(0)";


            flap.style.transform =
                "rotateX(0deg) translateZ(0px)";


            flap.style.opacity =
                "1";


            waxSeal.style.visibility =
                "visible";


            flapShadow.style.opacity =
                "0";


            flapShadow.style.transform =
                "translate(-50%, -50%) scaleY(0.05)";


            const initial =
                getFlapGeometry(0);


            flapPath.setAttribute(
                "d",
                initial.d
            );


            flapEdgePath.setAttribute(
                "d",
                initial.d
            );


            flapPath.setAttribute(
                "fill",
                "url(#paperFront)"
            );


            waxSeal.style.left =
                `${initial.tipX / 10}%`;


            waxSeal.style.top =
                `${initial.tipY / 10}%`;


            frontStop1.setAttribute(
                "stop-color",
                "#EADCC8"
            );


            frontStop2.setAttribute(
                "stop-color",
                "#EADCC8"
            );


            frontStop3.setAttribute(
                "stop-color",
                "#DFCAB0"
            );


            hint.classList.remove(
                "hidden"
            );

        }


        /* ================================================== */
        /* EVENTI                                            */
        /* ================================================== */

        envelopeTest.addEventListener(
            "click",
            openEnvelope
        );


        envelopeTest.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    openEnvelope();

                }

            }
        );


        restartButton.addEventListener(
            "click",
            resetEnvelope
        );


        /* ================================================== */
        /* STATO INIZIALE                                    */
        /* ================================================== */

        const initialGeometry =
            getFlapGeometry(0);


        flapPath.setAttribute(
            "d",
            initialGeometry.d
        );


        flapEdgePath.setAttribute(
            "d",
            initialGeometry.d
        );


        waxSeal.style.left =
            `${initialGeometry.tipX / 10}%`;


        waxSeal.style.top =
            `${initialGeometry.tipY / 10}%`;

    </script>


</body>

</html>
