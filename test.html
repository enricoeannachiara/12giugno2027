<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test busta SVG</title>

    <style>

        :root {
            --background: #FAF7F2;
            --text: #3E3A39;

            --paper-front: #EADCC8;
            --paper-back: #E4D2BA;

            --paper-edge: #C5AE8D;

            --envelope-main: #EADCC8;
            --envelope-side: #E7D7C1;
            --envelope-bottom: #EBDDC9;

            --fold-line: rgba(110, 87, 62, 0.26);
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;

            width: 100%;
            min-height: 100%;
        }


        body {
            background: var(--background);

            color: var(--text);

            font-family: Georgia, serif;

            overflow: hidden;
        }


        /* ================================================== */
        /* HERO                                               */
        /* ================================================== */

        .hero {
            position: fixed;

            inset: 0;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;
        }


        .hero img {
            width: min(72vw, 340px);

            height: auto;

            display: block;

            margin-bottom: 20px;
        }


        .hero h1 {
            margin: 0;

            font-size: clamp(2.2rem, 8vw, 4rem);

            font-weight: 400;
        }


        .hero p {
            margin: 18px 0 0;

            letter-spacing: 4px;

            font-size: 1rem;
        }


        /* ================================================== */
        /* SCENA                                              */
        /* ================================================== */

        .envelope-test {
            position: fixed;

            inset: 0;

            z-index: 100;

            perspective: 1700px;

            perspective-origin: 50% 15%;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        /* ================================================== */
        /* CORPO COMPLETO DELLA BUSTA                         */
        /* ================================================== */

        .envelope-body {
            position: absolute;

            inset: 0;

            z-index: 15;

            overflow: hidden;

            background: var(--envelope-main);

            pointer-events: none;

            transform: translateY(0);

            will-change: transform;
        }


        /* ================================================== */
        /* SVG DELLA PARTE INFERIORE                          */
        /* ================================================== */

        .envelope-body-svg {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;
        }


        /*
            La parte bassa della busta viene ora costruita
            come una vera busta:

            - pannello sinistro;
            - pannello destro;
            - pannello inferiore;
            - linee di piega molto leggere.

            Tutti i colori sono volutamente molto simili.
        */


        /* ================================================== */
        /* OMBRA DEL LEMBO                                    */
        /* ================================================== */

        .flap-shadow {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 68%;
            height: 16%;

            z-index: 12;

            transform:
                translate(-50%, -50%)
                scaleY(0.05);

            transform-origin: center;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(66, 45, 28, 0.22) 0%,
                    rgba(66, 45, 28, 0.10) 46%,
                    rgba(66, 45, 28, 0) 78%
                );

            filter: blur(13px);

            opacity: 0;

            pointer-events: none;

            will-change:
                opacity,
                transform;
        }


        /* ================================================== */
        /* LEMBO                                              */
        /* ================================================== */

        .flap {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 50vh;

            z-index: 20;

            transform-origin: 50% 0;

            transform-style: preserve-3d;

            opacity: 1;

            will-change:
                transform,
                opacity;
        }


        /* ================================================== */
        /* SVG DEL LEMBO                                      */
        /* ================================================== */

        .flap-svg {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: visible;

            display: block;

            pointer-events: none;
        }


        /* ================================================== */
        /* SIGILLO                                            */
        /* ================================================== */

        .wax-seal {
            position: absolute;

            left: 50%;
            top: 100%;

            width: 108px;
            height: 108px;

            z-index: 30;

            transform:
                translate(-50%, -50%)
                translateZ(5px);

            transform-origin: center center;

            pointer-events: none;

            will-change:
                left,
                top;
        }


        .wax-seal img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 7px 7px
                    rgba(70, 25, 20, 0.25)
                );
        }


        /* ================================================== */
        /* INTERFACCIA TEST                                   */
        /* ================================================== */

        .hint {
            position: fixed;

            left: 50%;
            bottom: 24px;

            z-index: 200;

            transform: translateX(-50%);

            padding: 9px 15px;

            border-radius: 999px;

            background:
                rgba(250, 247, 242, 0.86);

            font-family: Arial, sans-serif;

            font-size: 0.78rem;

            letter-spacing: 1px;

            color: #77706A;

            pointer-events: none;

            transition:
                opacity 0.3s ease;
        }


        .hint.hidden {
            opacity: 0;
        }


        .restart {
            position: fixed;

            top: 18px;
            right: 18px;

            z-index: 300;

            min-width: 44px;
            min-height: 44px;

            padding: 10px 15px;

            border: 0;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.92);

            color: #4C4743;

            font-size: 0.85rem;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }


        @media (max-width: 600px) {

            .wax-seal {
                width: 96px;
                height: 96px;
            }

        }

    </style>
</head>


<body>


    <!-- ================================================== -->
    <!-- HERO                                               -->
    <!-- ================================================== -->

    <main class="hero">

        <img
            src="images/ritratto.png"
            alt="Enrico e Annachiara"
        >

        <h1>
            Enrico & Annachiara
        </h1>

        <p>
            12 giugno 2027
        </p>

    </main>


    <!-- ================================================== -->
    <!-- BUSTA                                              -->
    <!-- ================================================== -->

    <div
        class="envelope-test"
        id="envelopeTest"
        role="button"
        tabindex="0"
        aria-label="Apri la busta"
    >


        <!-- OMBRA DEL LEMBO -->

        <div
            class="flap-shadow"
            id="flapShadow"
        ></div>


        <!-- ================================================== -->
        <!-- PARTE INFERIORE DELLA BUSTA                        -->
        <!-- ================================================== -->

        <div
            class="envelope-body"
            id="envelopeBody"
        >

            <svg
                class="envelope-body-svg"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
                aria-hidden="true"
            >


                <!-- SFONDO COMPLETO -->

                <rect
                    x="0"
                    y="0"
                    width="1000"
                    height="1000"
                    fill="#EADCC8"
                />


                <!-- ======================================== -->
                <!-- PANNELLO SINISTRO                       -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 0
                        L 500 500
                        L 0 1000
                        Z
                    "
                    fill="#E7D7C1"
                />


                <!-- ======================================== -->
                <!-- PANNELLO DESTRO                         -->
                <!-- ======================================== -->

                <path
                    d="
                        M 1000 0
                        L 500 500
                        L 1000 1000
                        Z
                    "
                    fill="#E7D7C1"
                />


                <!-- ======================================== -->
                <!-- PANNELLO INFERIORE                      -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 1000
                        L 500 500
                        L 1000 1000
                        Z
                    "
                    fill="#EBDDC9"
                />


                <!-- ======================================== -->
                <!-- PIEGA SINISTRA                          -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 0
                        L 500 500
                    "
                    fill="none"
                    stroke="rgba(110,87,62,0.24)"
                    stroke-width="2"
                    vector-effect="non-scaling-stroke"
                />


                <!-- ======================================== -->
                <!-- PIEGA DESTRA                            -->
                <!-- ======================================== -->

                <path
                    d="
                        M 1000 0
                        L 500 500
                    "
                    fill="none"
                    stroke="rgba(110,87,62,0.24)"
                    stroke-width="2"
                    vector-effect="non-scaling-stroke"
                />


                <!-- ======================================== -->
                <!-- PIEGHE DAL BASSO                        -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 1000
                        L 500 500
                    "
                    fill="none"
                    stroke="rgba(110,87,62,0.18)"
                    stroke-width="2"
                    vector-effect="non-scaling-stroke"
                />


                <path
                    d="
                        M 1000 1000
                        L 500 500
                    "
                    fill="none"
                    stroke="rgba(110,87,62,0.18)"
                    stroke-width="2"
                    vector-effect="non-scaling-stroke"
                />


            </svg>

        </div>


        <!-- ================================================== -->
        <!-- LEMBO SUPERIORE                                    -->
        <!-- ================================================== -->

        <div
            class="flap"
            id="flap"
        >

            <svg
                class="flap-svg"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
                aria-hidden="true"
            >

                <defs>


                    <!-- FRONTE -->

                    <linearGradient
                        id="paperFront"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            id="frontStop1"
                            offset="0%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop2"
                            offset="55%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop3"
                            offset="100%"
                            stop-color="#DFCAB0"
                        />

                    </linearGradient>


                    <!-- RETRO -->

                    <linearGradient
                        id="paperBack"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            offset="0%"
                            stop-color="#E6D6C1"
                        />

                        <stop
                            offset="100%"
                            stop-color="#DCC6AA"
                        />

                    </linearGradient>


                    <!-- OMBRA -->

                    <filter
                        id="paperShadow"
                        x="-20%"
                        y="-20%"
                        width="140%"
                        height="160%"
                    >

                        <feDropShadow
                            dx="0"
                            dy="5"
                            stdDeviation="6"
                            flood-color="#654B35"
                            flood-opacity="0.09"
                        />

                    </filter>

                </defs>


                <!-- BORDO -->

                <path
                    id="flapEdgePath"
                    d=""
                    fill="none"
                    stroke="#C7B08F"
                    stroke-width="3"
                    vector-effect="non-scaling-stroke"
                    opacity="0.55"
                />


                <!-- CARTA -->

                <path
                    id="flapPath"
                    d=""
                    fill="url(#paperFront)"
                    filter="url(#paperShadow)"
                />

            </svg>


            <!-- SIGILLO -->

            <div
                class="wax-seal"
                id="waxSeal"
            >

                <img
                    src="images/sigillo-AE.png"
                    alt=""
                    draggable="false"
                >

            </div>

        </div>

    </div>


    <div
        class="hint"
        id="hint"
    >
        Tocca per aprire
    </div>


    <button
        type="button"
        class="restart"
        id="restartButton"
    >
        Riavvia
    </button>



    <script>

        /* ================================================== */
        /* ELEMENTI                                          */
        /* ================================================== */

        const envelopeTest =
            document.getElementById("envelopeTest");

        const envelopeBody =
            document.getElementById("envelopeBody");

        const flap =
            document.getElementById("flap");

        const flapPath =
            document.getElementById("flapPath");

        const flapEdgePath =
            document.getElementById("flapEdgePath");

        const waxSeal =
            document.getElementById("waxSeal");

        const flapShadow =
            document.getElementById("flapShadow");

        const frontStop1 =
            document.getElementById("frontStop1");

        const frontStop2 =
            document.getElementById("frontStop2");

        const frontStop3 =
            document.getElementById("frontStop3");

        const hint =
            document.getElementById("hint");

        const restartButton =
            document.getElementById("restartButton");


        /* ================================================== */
        /* STATO                                             */
        /* ================================================== */

        let flapFrameId = null;
        let bodyFrameId = null;
        let fadeFrameId = null;

        let opening = false;
        let opened = false;


        /* ================================================== */
        /* TEMPI                                             */
        /* ================================================== */

        const flapDuration =
            3400;


        /*
            NUOVO VALORE.

            La parte inferiore comincia
            a scendere già dopo 1,4 secondi.
        */

        const bodyStart =
            1400;


        const bodyDuration =
            1500;


        const flapFadeDuration =
            300;


        /* ================================================== */
        /* UTILITY                                           */
        /* ================================================== */

        function clamp(value, min, max) {

            return Math.min(
                Math.max(value, min),
                max
            );

        }


        function easeInOutCubic(t) {

            return (
                t < 0.5
                    ? 4 * t * t * t
                    : 1 -
                      Math.pow(
                          -2 * t + 2,
                          3
                      ) / 2
            );

        }


        function easeOutCubic(t) {

            return (
                1 -
                Math.pow(
                    1 - t,
                    3
                )
            );

        }


        function bendCurve(t) {

            const value =
                Math.sin(
                    Math.PI * t
                );

            return Math.pow(
                Math.max(0, value),
                0.72
            );

        }


        function wait(milliseconds) {

            return new Promise(
                (resolve) => {

                    setTimeout(
                        resolve,
                        milliseconds
                    );

                }
            );

        }


        /* ================================================== */
        /* GEOMETRIA DEL LEMBO                               */
        /* ================================================== */

        function getFlapGeometry(t) {

            const bend =
                bendCurve(t);


            /*
                Il lembo continua a partire
                dagli angoli superiori.
            */

            const baseLeft =
                0;


            const baseRight =
                1000;


            /*
                La punta rimane esattamente
                al centro verticale dello schermo.
            */

            const restingTipY =
                1000;


            const tipY =
                restingTipY -
                (225 * bend);


            const tipX =
                500 +
                (
                    5 *
                    Math.sin(
                        Math.PI *
                        t *
                        2
                    ) *
                    bend
                );


            /*
                NUOVA GEOMETRIA.

                Ogni lato è composto idealmente
                da due zone:

                1. parte alta curva;
                2. parte inferiore diagonale.

                Il cambio di inclinazione avviene
                circa a 1/4 dell'altezza
                del lembo dalla parte superiore,
                cioè circa ai 3/4 partendo
                dal basso.

                Questo è molto più simile
                a una busta reale.
            */


            /*
                PARTE ALTA DESTRA
            */

            const rightCurveX =
                970 -
                (15 * bend);


            const rightCurveY =
                120 +
                (50 * bend);


            /*
                PUNTO DI CAMBIO DIREZIONE
                sul lato destro.

                È molto più esterno rispetto
                alle versioni precedenti.
            */

            const rightShoulderX =
                865 -
                (30 * bend);


            const rightShoulderY =
                285 +
                (75 * bend);


            /*
                PARTE BASSA DESTRA.

                Il controllo è molto laterale:
                questo apre parecchio
                l'angolo finale.
            */

            const rightLowerX =
                790 -
                (35 * bend);


            const rightLowerY =
                760 -
                (85 * bend);


            /*
                SINISTRA speculare.
            */

            const leftCurveX =
                30 +
                (15 * bend);


            const leftCurveY =
                rightCurveY;


            const leftShoulderX =
                135 +
                (30 * bend);


            const leftShoulderY =
                rightShoulderY;


            const leftLowerX =
                210 +
                (35 * bend);


            const leftLowerY =
                rightLowerY;


            /*
                Costruiamo il path con
                QUATTRO curve Bézier.

                Non è più una sola curva
                continua dall'angolo alla punta.
            */

            const d = `
                M ${baseLeft} 0

                L ${baseRight} 0


                C
                ${baseRight} ${rightCurveY},
                ${rightCurveX} ${rightShoulderY},
                ${rightShoulderX} ${rightShoulderY}


                C
                ${rightLowerX} ${rightLowerY},
                ${665 - 25 * bend} ${930 - 80 * bend},
                ${tipX} ${tipY}


                C
                ${335 + 25 * bend} ${930 - 80 * bend},
                ${leftLowerX} ${leftLowerY},
                ${leftShoulderX} ${leftShoulderY}


                C
                ${leftCurveX} ${leftShoulderY},
                ${baseLeft} ${leftCurveY},
                ${baseLeft} 0

                Z
            `;


            return {
                d,
                tipX,
                tipY,
                bend
            };

        }


        /* ================================================== */
        /* DISEGNO DEL LEMBO                                 */
        /* ================================================== */

        function drawFlapFrame(progress) {

            const t =
                clamp(
                    progress,
                    0,
                    1
                );


            const geometry =
                getFlapGeometry(t);


            const bend =
                geometry.bend;


            let rotation;


            if (t < 0.94) {

                rotation =
                    181.5 *
                    easeInOutCubic(
                        t / 0.94
                    );

            } else {

                const settle =
                    (t - 0.94) /
                    0.06;


                rotation =
                    181.5 -
                    (
                        1.5 *
                        easeOutCubic(
                            settle
                        )
                    );

            }


            const depth =
                20 * bend;


            flap.style.transform =
                `rotateX(${rotation}deg)
                 translateZ(${depth}px)`;


            flapPath.setAttribute(
                "d",
                geometry.d
            );


            flapEdgePath.setAttribute(
                "d",
                geometry.d
            );


            /*
                Fronte / retro.
            */

            if (rotation < 90) {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperFront)"
                );

            } else {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperBack)"
                );

            }


            /*
                Sigillo.
            */

            waxSeal.style.left =
                `${geometry.tipX / 10}%`;


            waxSeal.style.top =
                `${geometry.tipY / 10}%`;


            waxSeal.style.visibility =
                rotation < 90
                    ? "visible"
                    : "hidden";


            /*
                Ombra.
            */

            flapShadow.style.opacity =
                `${0.25 * bend}`;


            flapShadow.style.transform =
                `
                translate(
                    -50%,
                    ${-50 + 18 * t}%
                )

                scaleX(
                    ${0.90 - 0.16 * bend}
                )

                scaleY(
                    ${0.10 + 0.80 * bend}
                )
                `;


            /*
                Luce.
            */

            const shade =
                Math.round(
                    9 * bend
                );


            frontStop1.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade},
                    ${220 - shade},
                    ${200 - shade}
                )`
            );


            frontStop2.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade / 2},
                    ${220 - shade / 2},
                    ${200 - shade / 2}
                )`
            );


            frontStop3.setAttribute(
                "stop-color",
                `rgb(
                    ${223 - shade},
                    ${202 - shade},
                    ${176 - shade}
                )`
            );

        }


        /* ================================================== */
        /* APERTURA LEMBO                                    */
        /* ================================================== */

        function animateFlap() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                flapDuration,
                                0,
                                1
                            );


                        drawFlapFrame(
                            progress
                        );


                        if (progress < 1) {

                            flapFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            flapFrameId =
                                null;

                            resolve();

                        }

                    }


                    flapFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* DISCESA DEL CORPO DELLA BUSTA                     */
        /* ================================================== */

        function animateEnvelopeDown() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                bodyDuration,
                                0,
                                1
                            );


                        const e =
                            easeInOutCubic(
                                progress
                            );


                        /*
                            Scende SOLO la parte inferiore.

                            Il lembo resta nella parte alta.
                        */

                        envelopeBody.style.transform =
                            `translateY(
                                ${112 * e}vh
                            )`;


                        if (progress < 1) {

                            bodyFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            bodyFrameId =
                                null;

                            resolve();

                        }

                    }


                    bodyFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* DISSOLVENZA LEMBO                                 */
        /* ================================================== */

        function fadeOutFlap() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                flapFadeDuration,
                                0,
                                1
                            );


                        const e =
                            easeOutCubic(
                                progress
                            );


                        flap.style.opacity =
                            `${1 - e}`;


                        flapShadow.style.opacity =
                            `${0.07 * (1 - e)}`;


                        if (progress < 1) {

                            fadeFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            flap.style.opacity =
                                "0";


                            flapShadow.style.opacity =
                                "0";


                            fadeFrameId =
                                null;


                            resolve();

                        }

                    }


                    fadeFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* APERTURA COMPLETA                                 */
        /* ================================================== */

        async function openEnvelope() {

            if (opening || opened) {
                return;
            }


            opening = true;


            hint.classList.add(
                "hidden"
            );


            /*
                0 ms:
                il lembo comincia ad aprirsi.
            */

            const flapPromise =
                animateFlap();


            /*
                1400 ms:
                la parte inferiore comincia
                già a sfilarsi.

                Quindi le due animazioni
                si sovrappongono per circa
                due secondi.
            */

            await wait(
                bodyStart
            );


            const bodyPromise =
                animateEnvelopeDown();


            /*
                Attendiamo il completamento
                del lembo.
            */

            await flapPromise;


            /*
                Immediatamente dopo,
                il lembo aperto sparisce.
            */

            const fadePromise =
                fadeOutFlap();


            await Promise.all([
                bodyPromise,
                fadePromise
            ]);


            opening = false;
            opened = true;

        }


        /* ================================================== */
        /* RESET                                             */
        /* ================================================== */

        function resetEnvelope(event) {

            event.stopPropagation();


            if (flapFrameId) {

                cancelAnimationFrame(
                    flapFrameId
                );

                flapFrameId = null;

            }


            if (bodyFrameId) {

                cancelAnimationFrame(
                    bodyFrameId
                );

                bodyFrameId = null;

            }


            if (fadeFrameId) {

                cancelAnimationFrame(
                    fadeFrameId
                );

                fadeFrameId = null;

            }


            opening = false;
            opened = false;


            envelopeBody.style.transform =
                "translateY(0)";


            flap.style.transform =
                "rotateX(0deg) translateZ(0px)";


            flap.style.opacity =
                "1";


            waxSeal.style.visibility =
                "visible";


            flapShadow.style.opacity =
                "0";


            flapShadow.style.transform =
                "translate(-50%, -50%) scaleY(0.05)";


            const initial =
                getFlapGeometry(0);


            flapPath.setAttribute(
                "d",
                initial.d
            );


            flapEdgePath.setAttribute(
                "d",
                initial.d
            );


            flapPath.setAttribute(
                "fill",
                "url(#paperFront)"
            );


            waxSeal.style.left =
                `${initial.tipX / 10}%`;


            waxSeal.style.top =
                `${initial.tipY / 10}%`;


            frontStop1.setAttribute(
                "stop-color",
                "#EADCC8"
            );


            frontStop2.setAttribute(
                "stop-color",
                "#EADCC8"
            );


            frontStop3.setAttribute(
                "stop-color",
                "#DFCAB0"
            );


            hint.classList.remove(
                "hidden"
            );

        }


        /* ================================================== */
        /* EVENTI                                            */
        /* ================================================== */

        envelopeTest.addEventListener(
            "click",
            openEnvelope
        );


        envelopeTest.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    openEnvelope();

                }

            }
        );


        restartButton.addEventListener(
            "click",
            resetEnvelope
        );


        /* ================================================== */
        /* STATO INIZIALE                                    */
        /* ================================================== */

        const initialGeometry =
            getFlapGeometry(0);


        flapPath.setAttribute(
            "d",
            initialGeometry.d
        );


        flapEdgePath.setAttribute(
            "d",
            initialGeometry.d
        );


        waxSeal.style.left =
            `${initialGeometry.tipX / 10}%`;


        waxSeal.style.top =
            `${initialGeometry.tipY / 10}%`;

    </script>


</body>

</html>
