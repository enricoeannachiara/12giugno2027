<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test busta matrimonio</title>

    <style>

        :root {
            --background: #FAF7F2;
            --text: #3E3A39;

            --paper: #EADCC8;
            --paper-back: #E5D5BF;

            --paper-side: #E8D7C0;
            --paper-bottom: #ECDEC9;

            --paper-edge: #C8B08F;

            --fold-line: rgba(104, 80, 57, 0.22);
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;

            width: 100%;
            min-height: 100%;
        }


        body {
            overflow: hidden;

            background: var(--background);

            color: var(--text);

            font-family: Georgia, serif;
        }


        /* ================================================== */
        /* HERO                                               */
        /* ================================================== */

        .hero {
            position: fixed;

            inset: 0;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 30px 20px;

            text-align: center;
        }


        .hero img {
            display: block;

            width: min(72vw, 340px);

            height: auto;

            margin-bottom: 20px;
        }


        .hero h1 {
            margin: 0;

            font-size: clamp(2.2rem, 8vw, 4rem);

            font-weight: 400;
        }


        .hero p {
            margin: 18px 0 0;

            font-size: 1rem;

            letter-spacing: 4px;
        }


        /* ================================================== */
        /* SCENA                                              */
        /* ================================================== */

        .envelope-test {
            position: fixed;

            inset: 0;

            z-index: 100;

            perspective: 1700px;

            perspective-origin: 50% 12%;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        /* ================================================== */
        /* CORPO DELLA BUSTA                                  */
        /* ================================================== */

        .envelope-body {
            position: absolute;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            transform: translateY(0);

            will-change: transform;
        }


        .body-svg {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            overflow: visible;
        }


        /* ================================================== */
        /* OMBRA DEL LEMBO                                    */
        /* ================================================== */

        .flap-shadow {
            position: absolute;

            left: 50%;
            top: 50%;

            z-index: 14;

            width: 68%;
            height: 14%;

            transform:
                translate(-50%, -50%)
                scaleY(0.04);

            transform-origin: center;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(63, 43, 28, 0.23) 0%,
                    rgba(63, 43, 28, 0.10) 45%,
                    rgba(63, 43, 28, 0) 78%
                );

            filter: blur(13px);

            opacity: 0;

            pointer-events: none;

            will-change:
                opacity,
                transform;
        }


        /* ================================================== */
        /* LEMBO SUPERIORE                                    */
        /* ================================================== */

        .flap {
            position: absolute;

            left: 0;
            top: 0;

            z-index: 20;

            width: 100vw;
            height: 50vh;

            transform-origin: 50% 0;

            transform-style: preserve-3d;

            opacity: 1;

            will-change:
                transform,
                opacity;
        }


        .flap-svg {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            overflow: visible;

            pointer-events: none;
        }


        /* ================================================== */
        /* SIGILLO                                            */
        /* ================================================== */

        .wax-seal {
            position: absolute;

            /*
                A riposo:

                left = 50vw
                top  = 50vh

                quindi centro esatto
                dello schermo.
            */

            left: 50%;
            top: 100%;

            z-index: 30;

            width: 108px;
            height: 108px;

            transform:
                translate(-50%, -50%)
                translateZ(5px);

            transform-origin: center;

            pointer-events: none;

            will-change:
                left,
                top;
        }


        .wax-seal img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 7px 7px
                    rgba(70, 25, 20, 0.25)
                );
        }


        /* ================================================== */
        /* UI TEST                                            */
        /* ================================================== */

        .hint {
            position: fixed;

            left: 50%;
            bottom: 24px;

            z-index: 200;

            transform: translateX(-50%);

            padding: 9px 15px;

            border-radius: 999px;

            background:
                rgba(250, 247, 242, 0.86);

            color: #77706A;

            font-family: Arial, sans-serif;

            font-size: 0.78rem;

            letter-spacing: 1px;

            pointer-events: none;

            transition: opacity 0.3s ease;
        }


        .hint.hidden {
            opacity: 0;
        }


        .restart {
            position: fixed;

            top: 18px;
            right: 18px;

            z-index: 300;

            min-width: 44px;
            min-height: 44px;

            padding: 10px 15px;

            border: 0;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.92);

            color: #4C4743;

            font-size: 0.85rem;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }


        @media (max-width: 600px) {

            .wax-seal {
                width: 96px;
                height: 96px;
            }

        }

    </style>
</head>


<body>


    <!-- ================================================== -->
    <!-- HERO                                               -->
    <!-- ================================================== -->

    <main class="hero">

        <img
            src="images/ritratto.png"
            alt="Enrico e Annachiara"
        >

        <h1>
            Enrico & Annachiara
        </h1>

        <p>
            12 giugno 2027
        </p>

    </main>



    <!-- ================================================== -->
    <!-- BUSTA                                              -->
    <!-- ================================================== -->

    <div
        class="envelope-test"
        id="envelopeTest"
        role="button"
        tabindex="0"
        aria-label="Apri la busta"
    >


        <!-- ================================================== -->
        <!-- OMBRA                                             -->
        <!-- ================================================== -->

        <div
            class="flap-shadow"
            id="flapShadow"
        ></div>



        <!-- ================================================== -->
        <!-- CORPO BUSTA                                        -->
        <!-- ================================================== -->

        <div
            class="envelope-body"
            id="envelopeBody"
        >

            <svg
                class="body-svg"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
                aria-hidden="true"
            >


                <!--
                    NON esiste uno sfondo pieno.

                    La zona superiore centrale è
                    realmente trasparente.

                    Quando il lembo si apre,
                    vedremo la Hero attraverso
                    questo spazio.
                -->


                <!-- ======================================== -->
                <!-- LEMBO LATERALE SINISTRO                 -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 0

                        L 500 575

                        L 0 1000

                        Z
                    "
                    fill="#E8D7C0"
                />


                <!-- ======================================== -->
                <!-- LEMBO LATERALE DESTRO                   -->
                <!-- ======================================== -->

                <path
                    d="
                        M 1000 0

                        L 1000 1000

                        L 500 575

                        Z
                    "
                    fill="#E8D7C0"
                />


                <!-- ======================================== -->
                <!-- LEMBO INFERIORE                         -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 1000

                        L 500 575

                        L 1000 1000

                        Z
                    "
                    fill="#ECDEC9"
                />


                <!-- ======================================== -->
                <!-- PIEGA SINISTRA                          -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 0

                        L 500 575
                    "
                    fill="none"

                    stroke="rgba(104,80,57,0.24)"

                    stroke-width="2"

                    vector-effect="non-scaling-stroke"
                />


                <!-- ======================================== -->
                <!-- PIEGA DESTRA                            -->
                <!-- ======================================== -->

                <path
                    d="
                        M 1000 0

                        L 500 575
                    "
                    fill="none"

                    stroke="rgba(104,80,57,0.24)"

                    stroke-width="2"

                    vector-effect="non-scaling-stroke"
                />


                <!-- ======================================== -->
                <!-- PIEGA INFERIORE SINISTRA                -->
                <!-- ======================================== -->

                <path
                    d="
                        M 0 1000

                        L 500 575
                    "
                    fill="none"

                    stroke="rgba(104,80,57,0.17)"

                    stroke-width="2"

                    vector-effect="non-scaling-stroke"
                />


                <!-- ======================================== -->
                <!-- PIEGA INFERIORE DESTRA                  -->
                <!-- ======================================== -->

                <path
                    d="
                        M 1000 1000

                        L 500 575
                    "
                    fill="none"

                    stroke="rgba(104,80,57,0.17)"

                    stroke-width="2"

                    vector-effect="non-scaling-stroke"
                />


            </svg>

        </div>



        <!-- ================================================== -->
        <!-- LEMBO SUPERIORE                                    -->
        <!-- ================================================== -->

        <div
            class="flap"
            id="flap"
        >

            <svg
                class="flap-svg"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
                aria-hidden="true"
            >

                <defs>


                    <!-- FRONTE -->

                    <linearGradient
                        id="paperFront"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            id="frontStop1"
                            offset="0%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop2"
                            offset="58%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop3"
                            offset="100%"
                            stop-color="#DFCAB0"
                        />

                    </linearGradient>


                    <!-- RETRO -->

                    <linearGradient
                        id="paperBack"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            offset="0%"
                            stop-color="#E6D6C1"
                        />

                        <stop
                            offset="100%"
                            stop-color="#DCC6AA"
                        />

                    </linearGradient>


                    <!-- OMBRA -->

                    <filter
                        id="paperShadow"
                        x="-20%"
                        y="-20%"
                        width="140%"
                        height="160%"
                    >

                        <feDropShadow
                            dx="0"
                            dy="5"
                            stdDeviation="6"
                            flood-color="#654B35"
                            flood-opacity="0.09"
                        />

                    </filter>

                </defs>


                <!-- BORDO -->

                <path
                    id="flapEdgePath"
                    d=""

                    fill="none"

                    stroke="#C8B08F"

                    stroke-width="3"

                    vector-effect="non-scaling-stroke"

                    opacity="0.55"
                />


                <!-- CARTA -->

                <path
                    id="flapPath"
                    d=""

                    fill="url(#paperFront)"

                    filter="url(#paperShadow)"
                />

            </svg>


            <!-- SIGILLO -->

            <div
                class="wax-seal"
                id="waxSeal"
            >

                <img
                    src="images/sigillo-AE.png"
                    alt=""
                    draggable="false"
                >

            </div>

        </div>

    </div>



    <!-- ================================================== -->
    <!-- CONTROLLI TEST                                     -->
    <!-- ================================================== -->

    <div
        class="hint"
        id="hint"
    >
        Tocca per aprire
    </div>


    <button
        type="button"
        class="restart"
        id="restartButton"
    >
        Riavvia
    </button>



    <script>

        /* ================================================== */
        /* ELEMENTI                                          */
        /* ================================================== */

        const envelopeTest =
            document.getElementById("envelopeTest");

        const envelopeBody =
            document.getElementById("envelopeBody");

        const flap =
            document.getElementById("flap");

        const flapPath =
            document.getElementById("flapPath");

        const flapEdgePath =
            document.getElementById("flapEdgePath");

        const waxSeal =
            document.getElementById("waxSeal");

        const flapShadow =
            document.getElementById("flapShadow");

        const frontStop1 =
            document.getElementById("frontStop1");

        const frontStop2 =
            document.getElementById("frontStop2");

        const frontStop3 =
            document.getElementById("frontStop3");

        const hint =
            document.getElementById("hint");

        const restartButton =
            document.getElementById("restartButton");


        /* ================================================== */
        /* STATO                                             */
        /* ================================================== */

        let flapFrameId = null;
        let bodyFrameId = null;
        let fadeFrameId = null;

        let opening = false;
        let opened = false;


        /* ================================================== */
        /* TEMPI                                             */
        /* ================================================== */

        const flapDuration =
            3400;


        /*
            Timing approvato.
        */

        const bodyStart =
            1600;


        const bodyDuration =
            1450;


        const flapFadeDuration =
            280;


        /* ================================================== */
        /* UTILITY                                           */
        /* ================================================== */

        function clamp(value, min, max) {

            return Math.min(
                Math.max(value, min),
                max
            );

        }


        function easeInOutCubic(t) {

            return (
                t < 0.5
                    ? 4 * t * t * t
                    : 1 -
                      Math.pow(
                          -2 * t + 2,
                          3
                      ) / 2
            );

        }


        function easeOutCubic(t) {

            return (
                1 -
                Math.pow(
                    1 - t,
                    3
                )
            );

        }


        function bendCurve(t) {

            const value =
                Math.sin(
                    Math.PI * t
                );

            return Math.pow(
                Math.max(0, value),
                0.72
            );

        }


        function wait(milliseconds) {

            return new Promise(
                (resolve) => {

                    setTimeout(
                        resolve,
                        milliseconds
                    );

                }
            );

        }


        /* ================================================== */
        /* GEOMETRIA DEL LEMBO                               */
        /* ================================================== */

        function getFlapGeometry(t) {

            const bend =
                bendCurve(t);


            /*
                PUNTA.

                t = 0:
                x = 500
                y = 1000

                Poiché il contenitore è alto 50vh,
                il sigillo si trova esattamente a:

                50vw / 50vh

                quindi centro dello schermo.
            */

            const tipX =
                500 +
                (
                    3.5 *
                    Math.sin(
                        Math.PI *
                        t *
                        2
                    ) *
                    bend
                );


            const tipY =
                1000 -
                (
                    205 *
                    bend
                );


            /*
                FORMA DA BUSTA CLASSICA.

                In alto il bordo scende quasi
                verticalmente.

                Poi si incurva.

                Solo dopo la "spalla"
                inizia la lunga diagonale
                verso il sigillo.
            */


            /*
                SPALLA DESTRA
            */

            const rightShoulderX =
                915 -
                (20 * bend);


            const rightShoulderY =
                300 +
                (65 * bend);


            /*
                DIAGONALE DESTRA
            */

            const rightDiagonalX =
                760 -
                (32 * bend);


            const rightDiagonalY =
                610 -
                (60 * bend);


            /*
                ZONA VICINA ALLA PUNTA
            */

            const rightTipControlX =
                650 -
                (20 * bend);


            const rightTipControlY =
                885 -
                (70 * bend);


            /*
                SINISTRA SPECULARE
            */

            const leftShoulderX =
                85 +
                (20 * bend);


            const leftShoulderY =
                rightShoulderY;


            const leftDiagonalX =
                240 +
                (32 * bend);


            const leftDiagonalY =
                rightDiagonalY;


            const leftTipControlX =
                350 +
                (20 * bend);


            const leftTipControlY =
                rightTipControlY;


            /*
                PATH DEL LEMBO.

                Nota importante:

                NON utilizziamo una singola curva.

                Il lato destro è composto da:

                1) bordo superiore;
                2) curva della spalla;
                3) diagonale;
                4) arrotondamento verso la punta.

                E poi la stessa cosa
                specchiata a sinistra.
            */

            const d = `

                M 0 0


                L 1000 0


                C
                998 ${130 + 20 * bend},
                980 ${245 + 35 * bend},
                ${rightShoulderX} ${rightShoulderY}


                C
                ${860 - 22 * bend} ${380 + 40 * bend},
                ${rightDiagonalX} ${rightDiagonalY},
                ${rightTipControlX} ${rightTipControlY}


                C
                ${600 - 15 * bend} ${950 - 55 * bend},
                ${550 - 8 * bend} ${985 - 20 * bend},
                ${tipX} ${tipY}


                C
                ${450 + 8 * bend} ${985 - 20 * bend},
                ${400 + 15 * bend} ${950 - 55 * bend},
                ${leftTipControlX} ${leftTipControlY}


                C
                ${leftDiagonalX} ${leftDiagonalY},
                ${140 + 22 * bend} ${380 + 40 * bend},
                ${leftShoulderX} ${leftShoulderY}


                C
                20 ${245 + 35 * bend},
                2 ${130 + 20 * bend},
                0 0


                Z
            `;


            return {
                d,
                tipX,
                tipY,
                bend
            };

        }


        /* ================================================== */
        /* DISEGNO LEMBO                                     */
        /* ================================================== */

        function drawFlapFrame(progress) {

            const t =
                clamp(
                    progress,
                    0,
                    1
                );


            const geometry =
                getFlapGeometry(t);


            const bend =
                geometry.bend;


            /*
                Rotazione.
            */

            let rotation;


            if (t < 0.94) {

                rotation =
                    181.5 *
                    easeInOutCubic(
                        t / 0.94
                    );

            } else {

                const settle =
                    (
                        t -
                        0.94
                    ) /
                    0.06;


                rotation =
                    181.5 -
                    (
                        1.5 *
                        easeOutCubic(
                            settle
                        )
                    );

            }


            /*
                Profondità.
            */

            const depth =
                20 * bend;


            flap.style.transform =
                `rotateX(${rotation}deg)
                 translateZ(${depth}px)`;


            /* ---------------------------------------------- */
            /* CARTA                                         */
            /* ---------------------------------------------- */

            flapPath.setAttribute(
                "d",
                geometry.d
            );


            flapEdgePath.setAttribute(
                "d",
                geometry.d
            );


            /* ---------------------------------------------- */
            /* FRONTE / RETRO                                */
            /* ---------------------------------------------- */

            if (rotation < 90) {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperFront)"
                );

            } else {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperBack)"
                );

            }


            /* ---------------------------------------------- */
            /* SIGILLO                                       */
            /* ---------------------------------------------- */

            waxSeal.style.left =
                `${geometry.tipX / 10}%`;


            waxSeal.style.top =
                `${geometry.tipY / 10}%`;


            /*
                Superati 90° il sigillo
                è dietro il lembo.
            */

            waxSeal.style.visibility =
                rotation < 90
                    ? "visible"
                    : "hidden";


            /* ---------------------------------------------- */
            /* OMBRA                                         */
            /* ---------------------------------------------- */

            flapShadow.style.opacity =
                `${0.23 * bend}`;


            flapShadow.style.transform =
                `
                translate(
                    -50%,
                    ${-50 + 17 * t}%
                )

                scaleX(
                    ${0.92 - 0.15 * bend}
                )

                scaleY(
                    ${0.08 + 0.76 * bend}
                )
                `;


            /* ---------------------------------------------- */
            /* LUCE                                          */
            /* ---------------------------------------------- */

            const shade =
                Math.round(
                    8 * bend
                );


            frontStop1.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade},
                    ${220 - shade},
                    ${200 - shade}
                )`
            );


            frontStop2.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade / 2},
                    ${220 - shade / 2},
                    ${200 - shade / 2}
                )`
            );


            frontStop3.setAttribute(
                "stop-color",
                `rgb(
                    ${223 - shade},
                    ${202 - shade},
                    ${176 - shade}
                )`
            );

        }


        /* ================================================== */
        /* ANIMAZIONE LEMBO                                  */
        /* ================================================== */

        function animateFlap() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                flapDuration,
                                0,
                                1
                            );


                        drawFlapFrame(
                            progress
                        );


                        if (progress < 1) {

                            flapFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            flapFrameId =
                                null;


                            resolve();

                        }

                    }


                    flapFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* DISCESA DEL CORPO                                 */
        /* ================================================== */

        function animateEnvelopeDown() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                bodyDuration,
                                0,
                                1
                            );


                        const e =
                            easeInOutCubic(
                                progress
                            );


                        /*
                            Scende soltanto
                            il corpo della busta.
                        */

                        envelopeBody.style.transform =
                            `translateY(
                                ${112 * e}vh
                            )`;


                        if (progress < 1) {

                            bodyFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            bodyFrameId =
                                null;


                            resolve();

                        }

                    }


                    bodyFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* DISSOLVENZA LEMBO                                 */
        /* ================================================== */

        function fadeOutFlap() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const progress =
                            clamp(
                                (
                                    now -
                                    start
                                ) /
                                flapFadeDuration,
                                0,
                                1
                            );


                        const e =
                            easeOutCubic(
                                progress
                            );


                        flap.style.opacity =
                            `${1 - e}`;


                        flapShadow.style.opacity =
                            `${0.06 * (1 - e)}`;


                        if (progress < 1) {

                            fadeFrameId =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            flap.style.opacity =
                                "0";


                            flapShadow.style.opacity =
                                "0";


                            fadeFrameId =
                                null;


                            resolve();

                        }

                    }


                    fadeFrameId =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* APERTURA COMPLETA                                 */
        /* ================================================== */

        async function openEnvelope() {

            if (
                opening ||
                opened
            ) {
                return;
            }


            opening = true;


            hint.classList.add(
                "hidden"
            );


            /*
                Apertura lembo.
            */

            const flapPromise =
                animateFlap();


            /*
                Dopo 1600 ms parte
                lo sfilamento.
            */

            await wait(
                bodyStart
            );


            const bodyPromise =
                animateEnvelopeDown();


            /*
                Attendiamo che il lembo
                finisca la rotazione.
            */

            await flapPromise;


            /*
                Poi sparisce rapidamente.
            */

            const fadePromise =
                fadeOutFlap();


            await Promise.all([
                bodyPromise,
                fadePromise
            ]);


            opening = false;

            opened = true;

        }


        /* ================================================== */
        /* RESET                                             */
        /* ================================================== */

        function resetEnvelope(event) {

            event.stopPropagation();


            if (flapFrameId) {

                cancelAnimationFrame(
                    flapFrameId
                );

                flapFrameId = null;

            }


            if (bodyFrameId) {

                cancelAnimationFrame(
                    bodyFrameId
                );

                bodyFrameId = null;

            }


            if (fadeFrameId) {

                cancelAnimationFrame(
                    fadeFrameId
                );

                fadeFrameId = null;

            }


            opening = false;

            opened = false;


            envelopeBody.style.transform =
                "translateY(0)";


            flap.style.transform =
                "rotateX(0deg) translateZ(0px)";


            flap.style.opacity =
                "1";


            waxSeal.style.visibility =
                "visible";


            flapShadow.style.opacity =
                "0";


            flapShadow.style.transform =
                "translate(-50%, -50%) scaleY(0.04)";


            const initial =
                getFlapGeometry(0);


            flapPath.setAttribute(
                "d",
                initial.d
            );


            flapEdgePath.setAttribute(
                "d",
                initial.d
            );


            flapPath.setAttribute(
                "fill",
                "url(#paperFront)"
            );


            waxSeal.style.left =
                `${initial.tipX / 10}%`;


            waxSeal.style.top =
                `${initial.tipY / 10}%`;


            frontStop1.setAttribute(
                "stop-color",
                "#EADCC8"
            );


            frontStop2.setAttribute(
                "stop-color",
                "#EADCC8"
            );


            frontStop3.setAttribute(
                "stop-color",
                "#DFCAB0"
            );


            hint.classList.remove(
                "hidden"
            );

        }


        /* ================================================== */
        /* EVENTI                                            */
        /* ================================================== */

        envelopeTest.addEventListener(
            "click",
            openEnvelope
        );


        envelopeTest.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();


                    openEnvelope();

                }

            }
        );


        restartButton.addEventListener(
            "click",
            resetEnvelope
        );


        /* ================================================== */
        /* STATO INIZIALE                                    */
        /* ================================================== */

        const initialGeometry =
            getFlapGeometry(0);


        flapPath.setAttribute(
            "d",
            initialGeometry.d
        );


        flapEdgePath.setAttribute(
            "d",
            initialGeometry.d
        );


        waxSeal.style.left =
            `${initialGeometry.tipX / 10}%`;


        waxSeal.style.top =
            `${initialGeometry.tipY / 10}%`;

    </script>


</body>

</html>
