<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test busta SVG</title>

    <style>

        :root {
            --background: #FAF7F2;
            --text: #3E3A39;

            --paper-front: #EADCC8;
            --paper-back: #E4D2BA;
            --paper-edge: #C9B494;

            --pocket-paper: #EADCC8;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: var(--background);

            color: var(--text);

            font-family: Georgia, serif;

            overflow: hidden;
        }


        /* ================================================== */
        /* HERO DI SFONDO                                     */
        /* ================================================== */

        .hero {
            position: fixed;

            inset: 0;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;
        }


        .hero img {
            width: min(72vw, 340px);

            height: auto;

            display: block;

            margin-bottom: 20px;
        }


        .hero h1 {
            margin: 0;

            font-size: clamp(2.2rem, 8vw, 4rem);

            font-weight: 400;
        }


        .hero p {
            margin: 18px 0 0;

            letter-spacing: 4px;

            font-size: 1rem;
        }


        /* ================================================== */
        /* SCENA                                             */
        /* ================================================== */

        .envelope-test {
            position: fixed;

            inset: 0;

            z-index: 100;

            perspective: 1700px;

            perspective-origin: 50% 15%;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        /* ================================================== */
        /* CORPO DELLA BUSTA                                 */
        /* ================================================== */

        .envelope-body {
            position: absolute;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            transform: translateY(0);

            will-change: transform;
        }


        .envelope-pocket {
            position: absolute;

            inset: 0;

            background: transparent;
        }


        .pocket-left,
        .pocket-right,
        .pocket-bottom {
            position: absolute;

            inset: 0;

            background: var(--pocket-paper);
        }


        .pocket-left {
            clip-path: polygon(
                0 0,
                50% 50%,
                0 100%
            );
        }


        .pocket-right {
            clip-path: polygon(
                100% 0,
                100% 100%,
                50% 50%
            );
        }


        .pocket-bottom {
            clip-path: polygon(
                0 100%,
                50% 50%,
                100% 100%
            );
        }


        /* ================================================== */
        /* OMBRA DEL LEMBO SULLA HERO                        */
        /* ================================================== */

        .flap-shadow {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 70%;
            height: 18%;

            z-index: 12;

            transform:
                translate(-50%, -50%)
                scaleY(0.05);

            transform-origin: center;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(66, 45, 28, 0.25) 0%,
                    rgba(66, 45, 28, 0.12) 45%,
                    rgba(66, 45, 28, 0) 78%
                );

            filter: blur(14px);

            opacity: 0;

            pointer-events: none;

            will-change:
                opacity,
                transform;
        }


        /* ================================================== */
        /* LEMBO                                             */
        /* ================================================== */

        .flap {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 50vh;

            z-index: 20;

            transform-origin: 50% 0;

            transform-style: preserve-3d;

            will-change: transform;
        }


        /* ================================================== */
        /* SVG                                               */
        /* ================================================== */

        .flap-svg {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: visible;

            display: block;

            pointer-events: none;
        }


        /* ================================================== */
        /* SPESSORE DEL BORDO                                */
        /* ================================================== */

        .paper-edge {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            z-index: -1;

            pointer-events: none;

            opacity: 0;

            will-change:
                opacity,
                transform;
        }


        .paper-edge::before {
            content: "";

            position: absolute;

            inset: 0;

            background: var(--paper-edge);

            clip-path: polygon(
                0 0,
                100% 0,
                50% 100%
            );

            transform:
                translateY(1.5px)
                translateZ(-1px);
        }


        /* ================================================== */
        /* SIGILLO                                           */
        /* ================================================== */

        .wax-seal {
            position: absolute;

            left: 50%;
            top: 100%;

            width: 108px;
            height: 108px;

            z-index: 30;

            transform:
                translate(-50%, -50%)
                translateZ(5px);

            transform-origin: center center;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            will-change:
                top,
                transform;

            pointer-events: none;
        }


        .wax-seal img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 7px 7px
                    rgba(70, 25, 20, 0.25)
                );
        }


        /* ================================================== */
        /* UI DI TEST                                        */
        /* ================================================== */

        .hint {
            position: fixed;

            left: 50%;
            bottom: 24px;

            z-index: 200;

            transform: translateX(-50%);

            padding: 9px 15px;

            border-radius: 999px;

            background: rgba(250, 247, 242, 0.86);

            font-family: Arial, sans-serif;

            font-size: 0.78rem;

            letter-spacing: 1px;

            color: #77706A;

            pointer-events: none;

            transition: opacity 0.3s ease;
        }


        .hint.hidden {
            opacity: 0;
        }


        .restart {
            position: fixed;

            top: 18px;
            right: 18px;

            z-index: 300;

            min-width: 44px;
            min-height: 44px;

            padding: 10px 15px;

            border: 0;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.92);

            color: #4C4743;

            font-size: 0.85rem;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }


        @media (max-width: 600px) {

            .wax-seal {
                width: 96px;
                height: 96px;
            }

        }

    </style>
</head>


<body>


    <!-- ================================================== -->
    <!-- HERO                                              -->
    <!-- ================================================== -->

    <main class="hero">

        <img
            src="images/ritratto.png"
            alt="Enrico e Annachiara"
        >

        <h1>
            Enrico & Annachiara
        </h1>

        <p>
            12 giugno 2027
        </p>

    </main>


    <!-- ================================================== -->
    <!-- SCENA BUSTA                                        -->
    <!-- ================================================== -->

    <div
        class="envelope-test"
        id="envelopeTest"
        role="button"
        tabindex="0"
        aria-label="Apri la busta"
    >


        <!-- =============================================== -->
        <!-- OMBRA DEL LEMBO                                -->
        <!-- =============================================== -->

        <div
            class="flap-shadow"
            id="flapShadow"
        ></div>


        <!-- =============================================== -->
        <!-- CORPO BUSTA                                    -->
        <!-- =============================================== -->

        <div
            class="envelope-body"
            id="envelopeBody"
        >

            <div class="envelope-pocket">

                <div class="pocket-left"></div>

                <div class="pocket-right"></div>

                <div class="pocket-bottom"></div>

            </div>

        </div>


        <!-- =============================================== -->
        <!-- LEMBO                                          -->
        <!-- =============================================== -->

        <div
            class="flap"
            id="flap"
        >

            <div
                class="paper-edge"
                id="paperEdge"
            ></div>


            <svg
                class="flap-svg"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="none"
                aria-hidden="true"
            >

                <defs>


                    <!-- =================================== -->
                    <!-- FRONTE                             -->
                    <!-- =================================== -->

                    <linearGradient
                        id="paperFront"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            id="frontStop1"
                            offset="0%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop2"
                            offset="55%"
                            stop-color="#EADCC8"
                        />

                        <stop
                            id="frontStop3"
                            offset="100%"
                            stop-color="#DFCAB0"
                        />

                    </linearGradient>


                    <!-- =================================== -->
                    <!-- RETRO                              -->
                    <!-- =================================== -->

                    <linearGradient
                        id="paperBack"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >

                        <stop
                            id="backStop1"
                            offset="0%"
                            stop-color="#E6D6C1"
                        />

                        <stop
                            id="backStop2"
                            offset="100%"
                            stop-color="#DCC6AA"
                        />

                    </linearGradient>


                    <!-- =================================== -->
                    <!-- OMBRA CARTA                        -->
                    <!-- =================================== -->

                    <filter
                        id="paperShadow"
                        x="-20%"
                        y="-20%"
                        width="140%"
                        height="160%"
                    >

                        <feDropShadow
                            dx="0"
                            dy="5"
                            stdDeviation="6"
                            flood-color="#654B35"
                            flood-opacity="0.10"
                        />

                    </filter>

                </defs>


                <path
                    id="flapPath"
                    d="
                        M 0 0
                        L 1000 0
                        C 920 300, 720 730, 500 1000
                        C 280 730, 80 300, 0 0
                        Z
                    "
                    fill="url(#paperFront)"
                    filter="url(#paperShadow)"
                />

            </svg>


            <!-- ========================================== -->
            <!-- SIGILLO                                   -->
            <!-- ========================================== -->

            <div
                class="wax-seal"
                id="waxSeal"
            >

                <img
                    src="images/sigillo-AE.png"
                    alt=""
                    draggable="false"
                >

            </div>

        </div>

    </div>


    <div
        class="hint"
        id="hint"
    >
        Tocca per aprire
    </div>


    <button
        type="button"
        class="restart"
        id="restartButton"
    >
        Riavvia
    </button>



    <script>

        /* ================================================== */
        /* ELEMENTI                                          */
        /* ================================================== */

        const envelopeTest =
            document.getElementById("envelopeTest");

        const envelopeBody =
            document.getElementById("envelopeBody");

        const flap =
            document.getElementById("flap");

        const flapPath =
            document.getElementById("flapPath");

        const waxSeal =
            document.getElementById("waxSeal");

        const flapShadow =
            document.getElementById("flapShadow");

        const paperEdge =
            document.getElementById("paperEdge");

        const frontStop1 =
            document.getElementById("frontStop1");

        const frontStop2 =
            document.getElementById("frontStop2");

        const frontStop3 =
            document.getElementById("frontStop3");

        const backStop1 =
            document.getElementById("backStop1");

        const backStop2 =
            document.getElementById("backStop2");

        const hint =
            document.getElementById("hint");

        const restartButton =
            document.getElementById("restartButton");


        /* ================================================== */
        /* STATO                                             */
        /* ================================================== */

        let animationFrame = null;

        let opening = false;

        let opened = false;


        /*
            FASE 1:
            apertura lembo
        */

        const flapDuration =
            3400;


        /*
            FASE 2:
            busta che scivola verso il basso
        */

        const bodyDuration =
            1500;


        /*
            piccola pausa tra le due fasi
        */

        const bodyDelay =
            180;


        /* ================================================== */
        /* UTILITY                                           */
        /* ================================================== */

        function clamp(value, min, max) {

            return Math.min(
                Math.max(value, min),
                max
            );

        }


        function easeInOutCubic(t) {

            return (
                t < 0.5
                    ? 4 * t * t * t
                    : 1 -
                      Math.pow(
                          -2 * t + 2,
                          3
                      ) / 2
            );

        }


        function easeOutCubic(t) {

            return (
                1 -
                Math.pow(
                    1 - t,
                    3
                )
            );

        }


        /*
            Curvatura.

            Cresce molto tra 20° e 90°,
            poi si riduce.
        */

        function bendCurve(t) {

            const raw =
                Math.sin(
                    Math.PI * t
                );

            return Math.pow(
                raw,
                0.72
            );

        }


        /*
            Piccolo "tiro" iniziale.

            Nei primi 150 ms circa
            la punta reagisce appena.
        */

        function pullCurve(t) {

            if (t >= 0.055) {
                return 1;
            }

            return (
                t / 0.055
            );

        }


        /* ================================================== */
        /* FRAME DEL LEMBO                                   */
        /* ================================================== */

        function drawFlapFrame(progress) {

            const t =
                clamp(
                    progress,
                    0,
                    1
                );


            const e =
                easeInOutCubic(t);


            const bend =
                bendCurve(t);


            const pull =
                pullCurve(t);


            /*
             * ROTAZIONE
             *
             * Arriviamo a 182° e poi
             * rientriamo leggermente
             * negli ultimissimi frame.
             */

            let rotation;


            if (t < 0.92) {

                rotation =
                    182 *
                    easeInOutCubic(
                        t / 0.92
                    );

            } else {

                const settle =
                    (t - 0.92) / 0.08;


                rotation =
                    182 -
                    (2 *
                     easeOutCubic(
                         settle
                     ));

            }


            /*
             * PROFONDITÀ
             */

            const depth =
                22 * bend;


            flap.style.transform =
                `rotateX(${rotation}deg)
                 translateZ(${depth}px)`;


            /* ================================================== */
            /* DEFORMAZIONE DELLA CARTA                           */
            /* ================================================== */

            /*
                La punta viene "richiamata"
                verso la piega quando
                la carta è maggiormente curva.
            */

            const tipY =
                1000 -
                (
                    255 *
                    bend *
                    pull
                );


            /*
                Piccolissimo movimento laterale
                organico.
            */

            const tipX =
                500 +
                (
                    9 *
                    Math.sin(
                        Math.PI *
                        t *
                        2
                    ) *
                    bend
                );


            const upperY =
                275 +
                (
                    120 *
                    bend
                );


            const lowerY =
                735 -
                (
                    180 *
                    bend
                );


            const rightUpperX =
                930 -
                (
                    38 *
                    bend
                );


            const rightLowerX =
                720 +
                (
                    55 *
                    bend
                );


            const leftUpperX =
                70 +
                (
                    38 *
                    bend
                );


            const leftLowerX =
                280 -
                (
                    55 *
                    bend
                );


            const d = `
                M 0 0

                L 1000 0

                C
                ${rightUpperX} ${upperY},
                ${rightLowerX} ${lowerY},
                ${tipX} ${tipY}

                C
                ${leftLowerX} ${lowerY},
                ${leftUpperX} ${upperY},
                0 0

                Z
            `;


            flapPath.setAttribute(
                "d",
                d
            );


            /* ================================================== */
            /* FRONTE / RETRO                                    */
            /* ================================================== */

            if (rotation < 90) {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperFront)"
                );

            } else {

                flapPath.setAttribute(
                    "fill",
                    "url(#paperBack)"
                );

            }


            /* ================================================== */
            /* LUCE DINAMICA                                     */
            /* ================================================== */

            /*
                Quando la carta si inclina,
                aumentiamo leggermente
                il contrasto del gradiente.
            */

            const shade =
                Math.round(
                    12 * bend
                );


            frontStop1.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade},
                    ${220 - shade},
                    ${200 - shade}
                )`
            );


            frontStop2.setAttribute(
                "stop-color",
                `rgb(
                    ${234 - shade / 2},
                    ${220 - shade / 2},
                    ${200 - shade / 2}
                )`
            );


            frontStop3.setAttribute(
                "stop-color",
                `rgb(
                    ${223 - shade},
                    ${202 - shade},
                    ${176 - shade}
                )`
            );


            backStop1.setAttribute(
                "stop-color",
                `rgb(
                    ${230 - shade / 2},
                    ${214 - shade / 2},
                    ${193 - shade / 2}
                )`
            );


            backStop2.setAttribute(
                "stop-color",
                `rgb(
                    ${220 - shade},
                    ${198 - shade},
                    ${170 - shade}
                )`
            );


            /* ================================================== */
            /* SIGILLO                                           */
            /* ================================================== */

            const tipPercentage =
                tipY / 10;


            waxSeal.style.top =
                `${tipPercentage}%`;


            /*
                Fino ai 90° il sigillo
                resta sulla faccia visibile.

                Oltre i 90° lo nascondiamo:
                ora è fisicamente dietro
                alla carta.
            */

            if (rotation < 90) {

                waxSeal.style.visibility =
                    "visible";

            } else {

                waxSeal.style.visibility =
                    "hidden";

            }


            /* ================================================== */
            /* SPESSORE CARTA                                    */
            /* ================================================== */

            /*
                È più visibile quando il foglio
                è quasi perpendicolare.
            */

            const edgeAmount =
                Math.sin(
                    Math.PI * t
                );


            paperEdge.style.opacity =
                `${0.55 * edgeAmount}`;


            /* ================================================== */
            /* OMBRA DEL LEMBO                                   */
            /* ================================================== */

            flapShadow.style.opacity =
                `${0.28 * bend}`;


            const shadowScaleY =
                0.12 +
                (0.95 * bend);


            const shadowY =
                -50 +
                (22 * e);


            flapShadow.style.transform =
                `translate(
                    -50%,
                    ${shadowY}%
                )
                scaleX(
                    ${0.9 - 0.18 * bend}
                )
                scaleY(
                    ${shadowScaleY}
                )`;

        }


        /* ================================================== */
        /* ANIMAZIONE LEMBO                                  */
        /* ================================================== */

        function animateFlap() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const elapsed =
                            now - start;


                        const progress =
                            clamp(
                                elapsed /
                                flapDuration,
                                0,
                                1
                            );


                        drawFlapFrame(
                            progress
                        );


                        if (progress < 1) {

                            animationFrame =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            animationFrame = null;

                            resolve();

                        }

                    }


                    animationFrame =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* DISCESA DELLA BUSTA                               */
        /* ================================================== */

        function animateEnvelopeDown() {

            return new Promise(
                (resolve) => {


                    const start =
                        performance.now();


                    function frame(now) {

                        const elapsed =
                            now - start;


                        const progress =
                            clamp(
                                elapsed /
                                bodyDuration,
                                0,
                                1
                            );


                        const e =
                            easeInOutCubic(
                                progress
                            );


                        /*
                            Il corpo scende oltre
                            il fondo del viewport.
                        */

                        envelopeBody.style.transform =
                            `translateY(
                                ${110 * e}%
                            )`;


                        /*
                            Anche il lembo aperto
                            accompagna leggermente
                            il movimento verso il basso.

                            Così sembra appartenere
                            alla stessa busta.
                        */

                        flap.style.marginTop =
                            `${18 * e}vh`;


                        flapShadow.style.opacity =
                            `${0.12 * (1 - e)}`;


                        if (progress < 1) {

                            animationFrame =
                                requestAnimationFrame(
                                    frame
                                );

                        } else {

                            animationFrame = null;

                            resolve();

                        }

                    }


                    animationFrame =
                        requestAnimationFrame(
                            frame
                        );

                }
            );

        }


        /* ================================================== */
        /* APERTURA COMPLETA                                 */
        /* ================================================== */

        async function openEnvelope() {

            if (opening || opened) {
                return;
            }


            opening = true;

            hint.classList.add(
                "hidden"
            );


            /*
                FASE 1:
                apertura lembo
            */

            await animateFlap();


            /*
                piccola pausa naturale
            */

            await new Promise(
                (resolve) => {

                    setTimeout(
                        resolve,
                        bodyDelay
                    );

                }
            );


            /*
                FASE 2:
                busta che viene sfilata
            */

            await animateEnvelopeDown();


            opening = false;

            opened = true;

        }


        /* ================================================== */
        /* RESET                                             */
        /* ================================================== */

        function resetEnvelope(event) {

            event.stopPropagation();


            if (animationFrame) {

                cancelAnimationFrame(
                    animationFrame
                );

                animationFrame = null;

            }


            opening = false;

            opened = false;


            envelopeBody.style.transform =
                "translateY(0)";


            flap.style.transform =
                "rotateX(0deg) translateZ(0px)";


            flap.style.marginTop =
                "0";


            flapShadow.style.opacity =
                "0";


            flapShadow.style.transform =
                "translate(-50%, -50%) scaleY(0.05)";


            paperEdge.style.opacity =
                "0";


            waxSeal.style.top =
                "100%";


            waxSeal.style.visibility =
                "visible";


            flapPath.setAttribute(
                "fill",
                "url(#paperFront)"
            );


            flapPath.setAttribute(
                "d",
                `
                    M 0 0

                    L 1000 0

                    C
                    920 300,
                    720 730,
                    500 1000

                    C
                    280 730,
                    80 300,
                    0 0

                    Z
                `
            );


            frontStop1.setAttribute(
                "stop-color",
                "#EADCC8"
            );

            frontStop2.setAttribute(
                "stop-color",
                "#EADCC8"
            );

            frontStop3.setAttribute(
                "stop-color",
                "#DFCAB0"
            );


            hint.classList.remove(
                "hidden"
            );

        }


        /* ================================================== */
        /* EVENTI                                            */
        /* ================================================== */

        envelopeTest.addEventListener(
            "click",
            openEnvelope
        );


        envelopeTest.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    openEnvelope();

                }

            }
        );


        restartButton.addEventListener(
            "click",
            resetEnvelope
        );


        /* ================================================== */
        /* STATO INIZIALE                                    */
        /* ================================================== */

        drawFlapFrame(0);

    </script>


</body>

</html>
