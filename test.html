<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test PageFlip</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f1eb;

            font-family: Arial, sans-serif;
        }

        .test-wrapper {
            width: min(90vw, 700px);
        }

        #book {
            width: 100%;
            height: 420px;
        }

        .page {
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 2rem;

            border: 1px solid #ddd;
        }
    </style>
</head>


<body>

    <div class="test-wrapper">

        <div id="book">

            <div class="page">
                Pagina 1
            </div>

            <div class="page">
                Pagina 2
            </div>

            <div class="page">
                Pagina 3
            </div>

            <div class="page">
                Pagina 4
            </div>

        </div>

    </div>


    <script src="js/page-flip.browser.js"></script>

    <script>

        const pageFlip = new St.PageFlip(
            document.getElementById("book"),
            {
                width: 300,
                height: 420,

                size: "stretch",

                minWidth: 250,
                maxWidth: 500,

                minHeight: 350,
                maxHeight: 700,

                showCover: true,

                mobileScrollSupport: false,

                usePortrait: true,

                flippingTime: 1400
            }
        );


        pageFlip.loadFromHTML(
            document.querySelectorAll(".page")
        );


        document.body.addEventListener(
            "click",
            () => {

                pageFlip.flipNext();

            }
        );

    </script>

</body>

</html>
